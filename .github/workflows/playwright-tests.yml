name: Playwright Tests
on: [push, pull_request]

jobs:
  playwright:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest
    name: Playwright Tests
    timeout-minutes: 60

    steps:
      - name: Checkout addon
        uses: actions/checkout@v4
        with:
          path: volto-chatbot

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Create Volto project
        run: |
          npm install -g yo @plone/generator-volto
          yo @plone/volto volto-project --addon @eeacms/volto-chatbot --skip-install --no-interactive
          cd volto-project
          ln -s $GITHUB_WORKSPACE/volto-chatbot src/addons/volto-chatbot

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: |
          cd volto-project
          pnpm install

      - name: Install Playwright
        run: |
          cd volto-project
          pnpm add -D @playwright/test

      - name: Install Playwright browsers
        run: |
          cd volto-project
          pnpm exec playwright install chromium

      - name: Run Playwright tests
        run: |
          cd volto-project
          pnpm exec playwright test --config=src/addons/volto-chatbot/tests-playwright/playwright.config.ts
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: volto-project/src/addons/volto-chatbot/tests-playwright/playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: volto-project/src/addons/volto-chatbot/tests-playwright/test-results/
          retention-days: 30
